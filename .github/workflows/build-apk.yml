name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ranger les fichiers
        run: |
          mkdir -p www assets
          if [ -f index.html ]; then mv index.html www/index.html; fi
          for f in icon-only.png icon-foreground.png icon-background.png splash.png; do
            if [ -f "$f" ]; then mv "$f" assets/; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LeoPhysio-Triple-saut-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
